plugins:
  detectors:
    misleading:
      MustContradictNLI:
        hf_args:
          device: cuda
  generators:
    openai:
      OpenAICompatible:
        extra_params:
          extra_body:
            enable_thinking: true
        frequency_penalty: 0.0
        max_completion_tokens: 1024
        max_tokens: 1024
        min_p: 0.1
        presence_penalty: 0.0
        repetition_penalty: 1.0
        suppressed_params:
        - n
        system_prompt_template: '{instruction}'
        temperature: 0.0
        top_k: 25
        top_p: 0.9
        uri: http://127.0.0.1:8001/v1
