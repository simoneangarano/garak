plugins:
  detectors:
    misleading:
      MustContradictNLI:
        hf_args:
          device: cuda
  generators:
    openai:
      OpenAICompatible:
        extra_params:
          extra_body:
            chat_template_kwargs:
              enable_thinking: true
        frequency_penalty: 0.0
        max_completion_tokens: 131072
        max_tokens: 131072
        min_p: 0.0
        presence_penalty: 1.5
        repetition_penalty: 1.0
        request_timeout: 600
        suppressed_params:
        - n
        system_prompt_template: '{instruction}'
        temperature: 1.0
        top_k: 20
        top_p: 0.95
        uri: http://127.0.0.1:8001/v1
run:
  soft_probe_prompt_cap: 5
